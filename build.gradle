buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {


  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }

  // Force Eclipse to use the default JRE container instead of a version-specific one.
  // This prevents "Unbound classpath container" errors when the IDE doesn't recognize
  // a specific JavaSE-XX execution environment.
  eclipse {
    classpath {
      file {
        whenMerged { classpath ->
          classpath.entries.each { entry ->
            if (entry.hasProperty('path') && entry.path?.startsWith('org.eclipse.jdt.launching.JRE_CONTAINER')) {
              entry.path = 'org.eclipse.jdt.launching.JRE_CONTAINER'
            }
          }
        }
      }
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 17

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")

    doLast {
      // iterate through all files inside that folder
      // convert it to a relative path
      // and sort them
      def newContent = fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }
        .findAll { it != "assets.txt" } // Don't list the file itself
        .sort()
        .join("\n") + "\n"

      // Only write if the content actually changed to avoid triggering IDE sync issues
      if (!assetsFile.exists() || assetsFile.text != newContent) {
        assetsFile.text = newContent
      }
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'Forest Of Treasures'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'Forest Of Treasures' + '-parent'

// TTS model download helper task
apply from: 'tts-setup.gradle'
